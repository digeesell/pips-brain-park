<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe9c7" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brain Park" />
    <title>Pip's Brain Park</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="icon" href="icon.png" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="sun"></span>
      <span class="cloud cloud-a"></span>
      <span class="cloud cloud-b"></span>
      <span class="hill hill-back"></span>
      <span class="hill hill-mid"></span>
      <span class="hill hill-front"></span>
    </div>
    <div id="fx" class="fx" aria-hidden="true"></div>

    <header class="topbar">
      <button id="back-btn" class="icon-btn" hidden type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.5 5.5 8 12l7.5 6.5"
          />
        </svg>
      </button>
      <p id="header-title" class="header-title">Little Meadow Math</p>
      <div class="hud">
        <div id="timer-hud" class="timer-hud" hidden>
          <div class="timer-track"><span id="timer-fill"></span></div>
          <strong id="timer-sec">0</strong>
        </div>
        <div id="star-hud" class="star-hud" aria-label="Stars">
          <span class="star-icon">★</span>
          <span id="star-count">0</span>
        </div>
        <button id="sound-btn" class="icon-btn" type="button" aria-label="Turn sounds off" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              d="M4 10v4h3l4 3V7L7 10H4zM16 10.5c.8.6.8 2.4 0 3M18.5 9c1.6 1.2 1.6 4.8 0 6"
            />
          </svg>
        </button>
      </div>
    </header>

    <main id="app" class="app"></main>
    <script src="js/audio.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
